<!DOCTYPE html>
<html lang="en" data-theme="light">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ge'ez ↔ Arabic Number Converter</title>
  <meta name="description"
    content="Convert between Ge'ez (Ethiopian) numerals and Arabic numbers. Supports 1 to 99,999,999." />
  <link rel="stylesheet" href="style.css" />
</head>

<body>

  <!-- ══════════════════════════════════════════
       HEADER
  ══════════════════════════════════════════ -->
  <header class="site-header" role="banner">
    <div class="header-inner">
      <div class="brand">
        <span class="brand-geez" aria-hidden="true">፩፻</span>
        <div class="brand-text">
          <h1 class="site-title">Ge'ez ↔ Arabic</h1>
          <p class="site-subtitle">Ethiopian Numeral Converter</p>
        </div>
      </div>
      <button id="themeToggle" class="theme-toggle" aria-label="Toggle dark mode" title="Toggle dark / light theme">
        <span class="theme-icon" aria-hidden="true">🌙</span>
      </button>
    </div>
  </header>

  <!-- ══════════════════════════════════════════
       MAIN
  ══════════════════════════════════════════ -->
  <main id="main" role="main">

    <!-- ── COnVERTER CARD ── -->
    <section class="card converter-card" aria-label="Converter">

      <!-- Mode pills -->
      <div class="mode-bar" role="group" aria-label="Conversion direction">
        <button class="mode-pill active" id="modeAuto" data-mode="auto" aria-pressed="true">Auto Detect</button>
        <button class="mode-pill" id="modeAtoG" data-mode="a2g" aria-pressed="false">Arabic → Ge'ez</button>
        <button class="mode-pill" id="modeGtoA" data-mode="g2a" aria-pressed="false">Ge'ez → Arabic</button>
      </div>

      <!-- Conversion layout -->
      <div class="conversion-layout">

        <!-- Input -->
        <div class="panel input-panel">
          <label class="panel-label" for="inputField" id="inputLabel">Enter a number</label>
          <textarea id="inputField" class="number-field" placeholder="e.g. 123 or ፻፳፫" rows="3"
            aria-labelledby="inputLabel" aria-describedby="inputHint errorMsg" autocomplete="off"
            spellcheck="false"></textarea>
          <p id="inputHint" class="hint">Arabic (1–99,999,999) or Ge'ez numerals</p>
        </div>

        <!-- Arrow / Swap -->
        <div class="arrow-col" aria-hidden="true">
          <div class="arrow-track">
            <div class="arrow-shimmer"></div>
            <span class="arrow-glyph">⇄</span>
          </div>
        </div>

        <!-- Output -->
        <div class="panel output-panel">
          <label class="panel-label" id="outputLabel">Result</label>
          <div id="outputField" class="number-field output-field" role="status" aria-live="polite"
            aria-labelledby="outputLabel">
            <span class="output-placeholder">—</span>
          </div>
          <p id="detectedMode" class="hint"></p>
        </div>

      </div><!-- .conversion-layout -->

      <!-- Error -->
      <p id="errorMsg" class="error-msg" role="alert" aria-live="assertive"></p>

      <!-- Actions -->
      <div class="action-bar">
        <button id="convertBtn" class="btn btn-primary">
          <span class="btn-icon" aria-hidden="true">⇄</span> Convert
        </button>
        <button id="copyBtn" class="btn btn-secondary" disabled aria-label="Copy result to clipboard">
          <span class="btn-icon" aria-hidden="true">⎘</span> Copy
        </button>
        <button id="clearBtn" class="btn btn-ghost" aria-label="Clear input and output">
          <span class="btn-icon" aria-hidden="true">✕</span> Clear
        </button>
      </div>

    </section><!-- .converter-card -->

    <!-- ── QUICK REFERENCE ── -->
    <section class="card reference-card" aria-label="Ge'ez numeral reference">
      <h2 class="card-heading">Quick Reference</h2>
      <div class="ref-grid" id="refGrid" role="table" aria-label="Ge'ez numeral table"></div>
    </section>

    <!-- ── HISTORY ── -->
    <section class="card history-card" aria-label="Conversion history">
      <div class="history-header">
        <h2 class="card-heading">History <span id="historyCount" class="history-badge">0</span></h2>
        <button id="clearHistoryBtn" class="btn btn-ghost btn-sm" aria-label="Clear conversion history">Clear
          all</button>
      </div>
      <ul id="historyList" class="history-list" role="list" aria-label="Recent conversions">
        <li class="history-empty">No conversions yet.</li>
      </ul>
    </section>

  </main>

  <!-- ══════════════════════════════════════════
       FOOTER
  ══════════════════════════════════════════ -->
  <footer class="site-footer" role="contentinfo">
    <p>Built with care for Ethiopian cultural heritage &nbsp;·&nbsp; Ge'ez numerals (፩–፼) &nbsp;·&nbsp; Range:
      1–99,999,999</p>
  </footer>

  <script src="script.js"></script>
</body>

</html>
